<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitácora de Voz</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📓</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    .recording-pulse {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="bg-dark text-light d-flex flex-column min-vh-100">
  <div class="container py-4 flex-grow-1" style="max-width: 800px;">
    <!-- Grabador -->
    <main>
      <div class="card bg-body-tertiary shadow mb-4">
        <div class="card-body text-center py-4">
          <div class="d-flex justify-content-center gap-2 mb-3">
            <button id="btn-record" class="btn btn-danger btn-lg rounded-circle d-flex align-items-center justify-content-center p-3 shadow-lg" style="width: 140px; height: 140px;" aria-label="Iniciar Grabación">
              <i class="bi bi-mic-fill" style="font-size: 3.5rem;"></i>
            </button>
            <button id="btn-stop" class="btn btn-secondary btn-lg rounded-circle d-none d-flex align-items-center justify-content-center p-3 shadow-lg" style="width: 140px; height: 140px;" aria-label="Detener y Guardar">
              <i class="bi bi-stop-fill" style="font-size: 3.5rem;"></i>
            </button>
          </div>

          <p id="status-text" class="text-secondary mb-3">Presioná el botón para iniciar la grabación.</p>

          <div id="recording-spinner" class="d-none my-3">
            <div class="spinner-border text-danger" role="status">
              <span class="visually-hidden">Grabando...</span>
            </div>
          </div>

          <audio id="audio-preview" controls class="w-100 mt-3 d-none"></audio>
        </div>
      </div>

      <!-- Historial de Entradas -->
      <section>
        <h2 class="h4 mb-3">📖 Entradas Registradas</h2>
        <div id="lista-entradas" class="list-group">
          <div class="text-center text-secondary py-3">Cargando entradas...</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];

    const btnRecord = document.getElementById('btn-record');
    const btnStop = document.getElementById('btn-stop');
    const statusText = document.getElementById('status-text');
    const audioPreview = document.getElementById('audio-preview');
    const listaEntradas = document.getElementById('lista-entradas');

    let mimeType = '';

    btnRecord.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // Detectar MIME type soportado por el navegador móvil (ej. audio/webm o audio/mp4 en iOS)
        if (MediaRecorder.isTypeSupported('audio/webm')) {
          mimeType = 'audio/webm';
        } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
          mimeType = 'audio/mp4';
        } else if (MediaRecorder.isTypeSupported('audio/ogg')) {
          mimeType = 'audio/ogg';
        } else {
          mimeType = '';
        }

        const options = mimeType ? { mimeType } : {};
        mediaRecorder = new MediaRecorder(stream, options);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) {
            audioChunks.push(e.data);
          }
        };
        mediaRecorder.onstop = uploadAudio;

        mediaRecorder.start();
        btnRecord.classList.add('d-none');
        btnStop.classList.remove('d-none');
        statusText.textContent = '🔴 Grabando en progreso...';
        statusText.classList.add('text-danger', 'fw-bold');
      } catch (err) {
        alert('No se pudo acceder al micrófono: ' + err.message + '\n(Asegurate de estar usando una conexión segura HTTPS o localhost).');
      }
    });

    btnStop.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        btnStop.classList.add('d-none');
        btnRecord.classList.remove('d-none');
        statusText.textContent = '⚙️ Transcribiendo audio con Moonshine...';
        statusText.classList.remove('text-danger', 'fw-bold');
      }
    });

    async function uploadAudio() {
      const blobType = mimeType || 'audio/wav';
      const audioBlob = new Blob(audioChunks, { type: blobType });
      const formData = new FormData();
      formData.append('audio', audioBlob, 'grabacion.wav');

      try {
        const res = await fetch('/api/grabar', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.success) {
          statusText.textContent = '✅ Entrada guardada correctamente.';
          cargarEntradas();
        } else {
          statusText.textContent = '❌ Error al guardar entrada.';
        }
      } catch (err) {
        statusText.textContent = '❌ Error en la comunicación con el servidor.';
      }
    }

    let currentAudio = null;
    let currentBtn = null;

    function toggleAudio(relAudioPath, btn) {
      const audioUrl = `/storage/${relAudioPath}`;
      
      if (currentAudio && currentAudio.src.endsWith(audioUrl)) {
        if (currentAudio.paused) {
          currentAudio.play();
          btn.innerHTML = '<i class="bi bi-pause-fill fs-5"></i>';
        } else {
          currentAudio.pause();
          btn.innerHTML = '<i class="bi bi-play-fill fs-5"></i>';
        }
        return;
      }

      if (currentAudio) {
        currentAudio.pause();
        if (currentBtn) currentBtn.innerHTML = '<i class="bi bi-play-fill fs-5"></i>';
      }

      currentAudio = new Audio(audioUrl);
      currentBtn = btn;
      currentAudio.play();
      btn.innerHTML = '<i class="bi bi-pause-fill fs-5"></i>';

      currentAudio.onended = () => {
        btn.innerHTML = '<i class="bi bi-play-fill fs-5"></i>';
      };
    }

    async function toggleEstadoNueva(relMdPath, esNueva) {
      try {
        await fetch('/api/entradas/toggle-nueva', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ relMdPath, esNueva })
        });
        cargarEntradas();
      } catch (err) {
        console.error('Error al cambiar estado:', err);
      }
    }

    async function eliminarEntrada(relMdPath, relAudioPath, hora) {
      if (!confirm(`¿Estás seguro de que deseás eliminar la nota de las ${hora} y su archivo de audio?`)) {
        return;
      }

      if (currentAudio && currentAudio.src.includes(relAudioPath)) {
        currentAudio.pause();
        currentAudio = null;
      }

      try {
        const res = await fetch('/api/entradas/eliminar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ relMdPath, relAudioPath })
        });
        const data = await res.json();
        if (data.success) {
          cargarEntradas();
        } else {
          alert('Error al eliminar la entrada: ' + (data.error || 'Desconocido'));
        }
      } catch (err) {
        console.error('Error al eliminar:', err);
        alert('Error en la comunicación con el servidor al eliminar.');
      }
    }

    async function cargarEntradas() {
      try {
        const res = await fetch('/api/entradas');
        const entradas = await res.json();

        if (entradas.length === 0) {
          listaEntradas.innerHTML = '<div class="text-center text-secondary py-2 small">No hay entradas hoy.</div>';
          return;
        }

        listaEntradas.innerHTML = entradas.map(e => {
          const badgeNueva = e.esNueva 
            ? `<span class="badge bg-success text-white fw-semibold ms-1">Nueva</span>` 
            : `<span class="badge bg-secondary-subtle text-secondary-emphasis fw-normal ms-1">Revisada</span>`;

          return `
            <div class="list-group-item bg-body-tertiary border-secondary mb-1 rounded d-flex align-items-center justify-content-between px-3 py-2">
              <div class="d-flex align-items-center gap-2">
                <input class="form-check-input mt-0" type="checkbox" ${e.esNueva ? 'checked' : ''} onchange="toggleEstadoNueva('${e.relMdPath}', this.checked)" title="Marcar/Desmarcar como Nueva" aria-label="Marcar como nueva" style="cursor: pointer; width: 1.25em; height: 1.25em;">
                <a href="/storage/${e.relMdPath}" target="_blank" class="text-decoration-none text-light fw-bold fs-6 d-flex align-items-center gap-2 ms-1">
                  <i class="bi bi-clock text-primary"></i> ${e.hora}
                </a>
                ${badgeNueva}
              </div>
              <div class="d-flex align-items-center gap-2">
                <button class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center p-0" style="width: 36px; height: 36px;" onclick="toggleAudio('${e.relAudioPath}', this)" aria-label="Reproducir o pausar audio" title="Reproducir audio">
                  <i class="bi bi-play-fill fs-5"></i>
                </button>
                <button class="btn btn-outline-danger rounded-circle d-flex align-items-center justify-content-center p-0" style="width: 36px; height: 36px;" onclick="eliminarEntrada('${e.relMdPath}', '${e.relAudioPath}', '${e.hora}')" aria-label="Eliminar nota y audio" title="Eliminar nota y audio">
                  <i class="bi bi-trash3-fill fs-6"></i>
                </button>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        listaEntradas.innerHTML = '<div class="text-center text-danger py-3">Error al cargar entradas.</div>';
      }
    }

    cargarEntradas();
  </script>

  <!-- Footer -->
  <footer class="py-4 mt-auto border-top border-secondary-subtle bg-dark-subtle text-center">
    <div class="container text-center small">
      <h6 class="mb-1"><strong>Bitácora de Voz</strong> &copy; 2026 - Desarrollado con ❤️ por <strong>Juan Gabriel Maioli</strong></h6>
    </div>
  </footer>

</body>
</html>
