<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎙️ Bitácora de Voz a Texto</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    .recording-pulse {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="bg-dark text-light">
  <div class="container py-4" style="max-width: 800px;">
    <header class="pb-3 mb-4 border-bottom d-flex align-items-center justify-content-between">
      <h1 class="h3 m-0">🎙️ Bitácora de Voz</h1>
      <span class="badge bg-primary fs-6">Moonshine STT</span>
    </header>

    <!-- Grabador -->
    <main>
      <div class="card bg-body-tertiary shadow mb-4">
        <div class="card-body text-center py-4">
          <h2 class="h5 card-title mb-3">Grabar Nueva Entrada</h2>
          <p id="status-text" class="text-secondary mb-3">Presioná el botón para iniciar la grabación.</p>

          <div class="d-flex justify-content-center gap-2 mb-3">
            <button id="btn-record" class="btn btn-danger btn-lg px-4 d-flex align-items-center gap-2">
              <i class="bi bi-mic-fill"></i> Iniciar Grabación
            </button>
            <button id="btn-stop" class="btn btn-secondary btn-lg px-4 d-none d-flex align-items-center gap-2">
              <i class="bi bi-stop-fill"></i> Detener y Guardar
            </button>
          </div>

          <div id="recording-spinner" class="d-none my-3">
            <div class="spinner-border text-danger" role="status">
              <span class="visually-hidden">Grabando...</span>
            </div>
          </div>

          <audio id="audio-preview" controls class="w-100 mt-3 d-none"></audio>
        </div>
      </div>

      <!-- Historial de Entradas -->
      <section>
        <h2 class="h4 mb-3">📖 Entradas Registradas</h2>
        <div id="lista-entradas" class="list-group">
          <div class="text-center text-secondary py-3">Cargando entradas...</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];

    const btnRecord = document.getElementById('btn-record');
    const btnStop = document.getElementById('btn-stop');
    const statusText = document.getElementById('status-text');
    const audioPreview = document.getElementById('audio-preview');
    const listaEntradas = document.getElementById('lista-entradas');

    btnRecord.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = uploadAudio;

        mediaRecorder.start();
        btnRecord.classList.add('d-none');
        btnStop.classList.remove('d-none');
        statusText.textContent = '🔴 Grabando en progreso...';
        statusText.classList.add('text-danger', 'fw-bold');
      } catch (err) {
        alert('No se pudo acceder al micrófono: ' + err.message);
      }
    });

    btnStop.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        btnStop.classList.add('d-none');
        btnRecord.classList.remove('d-none');
        statusText.textContent = '⚙️ Transcribiendo audio con Moonshine...';
        statusText.classList.remove('text-danger', 'fw-bold');
      }
    });

    async function uploadAudio() {
      const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
      const formData = new FormData();
      formData.append('audio', audioBlob, 'grabacion.wav');

      try {
        const res = await fetch('/api/grabar', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.success) {
          statusText.textContent = '✅ Entrada guardada correctamente.';
          cargarEntradas();
        } else {
          statusText.textContent = '❌ Error al guardar entrada.';
        }
      } catch (err) {
        statusText.textContent = '❌ Error en la comunicación con el servidor.';
      }
    }

    async function cargarEntradas() {
      try {
        const res = await fetch('/api/entradas');
        const entradas = await res.json();

        if (entradas.length === 0) {
          listaEntradas.innerHTML = '<div class="text-center text-secondary py-3">No hay entradas aún.</div>';
          return;
        }

        listaEntradas.innerHTML = entradas.map(e => `
          <div class="list-group-item bg-body-tertiary border-secondary mb-2 rounded">
            <div class="d-flex w-100 justify-content-between align-items-center mb-1">
              <h5 class="mb-1 text-primary">📅 ${e.nombre}</h5>
              <a href="/storage/${e.id}/entrada.md" target="_blank" class="btn btn-sm btn-outline-info">
                <i class="bi bi-file-earmark-text"></i> Abrir .md
              </a>
            </div>
            <p class="mb-2 text-light fs-6">${e.snippet || 'Sin transcripción'}</p>
            <audio controls class="w-100 mt-1" src="/storage/${e.id}/entrada.wav"></audio>
          </div>
        `).join('');
      } catch (err) {
        listaEntradas.innerHTML = '<div class="text-center text-danger py-3">Error al cargar entradas.</div>';
      }
    }

    cargarEntradas();
  </script>
</body>
</html>
