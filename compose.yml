services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - STORAGE_PATH=/app/storage
    volumes:
      - ./storage:/app/storage
      - ./ssl:/app/ssl
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    restart: unless-stopped
